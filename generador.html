<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CERTIFICADOS HEMET - DEFINITIVO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
body{background:#070707;color:#d4af37;text-align:center;font-family:Arial;margin:0;padding:12px}
.panel{background:#151515;border:2px solid #b8922d;border-radius:14px;max-width:560px;margin:auto;padding:20px}
input,select{width:92%;padding:12px;border-radius:8px;border:1px solid #b8922d;background:#222;color:#fff;margin:5px}
.row{display:flex;gap:6px;width:92%;margin:auto}
.btn{background:linear-gradient(#f3d87a,#b8922d);color:#000;border:none;padding:14px;width:92%;border-radius:10px;font-weight:900;margin-top:12px;cursor:pointer}
canvas{max-width:98%;border:2px solid #b8922d;border-radius:12px;margin:18px auto;display:block;background:#000}
.err{color:#ff4444;font-size:13px;display:none;margin-top:6px}
</style>
</head>
<body>
<h2 style="font-family:Cinzel">CERTIFICADOS ACADEMIA MILITAR</h2>
<div class="panel">
<input id="n" placeholder="NOMBRE DEL ASPIRANTE" oninput="g()" maxlength="40">
<div class="row">
<input id="d" type="number" value="11" oninput="g()">
<select id="m" onchange="g()"><option>Enero</option><option>Febrero</option><option>Marzo</option><option>Abril</option><option>Mayo</option><option>Junio</option><option>Julio</option><option selected>Agosto</option><option>Septiembre</option><option>Octubre</option><option>Noviembre</option><option>Diciembre</option></select>
<input id="a" type="number" value="2026" oninput="g()">
</div>
<input id="c" value="HEM-ACAD-2026-0002-792" oninput="g()">
<div id="err" class="err">El código debe empezar con HEM-ACAD-</div>
<button class="btn" onclick="g()">⚡ GENERAR CERTIFICADO</button>
<button class="btn" style="background:#222;color:#d4af37;border:1px solid" onclick="b()">⬇️ DESCARGAR HD</button>
</div>
<canvas id="cv" width="2400" height="1600"></canvas>
<script>
const cv=document.getElementById('cv'), x=cv.getContext('2d'), bg=new Image();
bg.src='plantilla.jpg';
function g(){
 let N=document.getElementById('n').value.trim().toUpperCase();
 let D=document.getElementById('d').value||'11';
 let M=document.getElementById('mes').value||'Agosto';
 let A=document.getElementById('a').value||'2026';
 let C=document.getElementById('c').value.trim().toUpperCase();
 if(C && !C.startsWith('HEM-ACAD-')){document.getElementById('err').style.display='block'; return;}
 document.getElementById('err').style.display='none';
 x.drawImage(bg,0,0,2400,1600);
 x.textAlign='center';
 // NOMBRE - justo encima de la línea
 if(N){
   let size = 110; if(N.length>18) size=85; if(N.length>26) size=68;
   x.fillStyle='#f8e9a8'; x.font=`bold ${size}px Cinzel,serif`;
   x.fillText(N,1200,780);
 }
 // Firmas caligráficas
 x.fillStyle='#e8d5a0';
 x.font='46px Great Vibes, cursive'; x.fillText('Wilson', 560, 1050);
 x.font='42px Great Vibes, cursive'; x.fillText('Xorrus Ramirez', 1840, 1050);
 // Fecha y Certificado abajo
 x.fillStyle='#e8d5a0'; x.font='20px Arial';
 x.textAlign='left'; x.fillText(D+' de '+M+' de '+A, 300, 1375);
 x.textAlign='right'; x.font='bold 18px Arial'; x.fillText(C, 2170, 1375);
 // Footer roleplay
 x.textAlign='center'; x.fillStyle='#777'; x.font='11px Arial';
 x.fillText('ESTE CERTIFICADO ES DE USO EXCLUSIVO PARA FICCIÓN Y JUEGOS DE ROL (ROLEPLAY)',1200,1545);
}
function b(){
 let C=document.getElementById('c').value;
 if(!C.startsWith('HEM-ACAD-')){alert('Código inválido');return;}
 let a=document.createElement('a'); a.download=C+'.jpg'; a.href=cv.toDataURL('image/jpeg',0.95); a.click();
}
bg.onload=g;
</script>
</body>
</html>
