<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador HEMET</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:15px}input,button{padding:12px;margin:5px;width:90%;max-width:400px;font-size:16px;border-radius:8px;border:none}button{background:#c9a227;color:#000;font-weight:700}canvas{max-width:100%;margin-top:15px;border:2px solid #c9a227}#qrcode{display:none}</style></head><body><h2>🎖️ GENERADOR HEMET LATAM</h2><input id="nombre" placeholder="Nombre del aspirante"><input id="codigo" placeholder="Codigo" value="HEM-ACAD-2024-0520-001"><br><button onclick="generar()">GENERAR CERTIFICADO</button><button onclick="descargar()">DESCARGAR JPG</button><div id="qrcode"></div><canvas id="canvas" width="1600" height="1131"></canvas><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');function generar(){const nombre=(document.getElementById('nombre').value.toUpperCase()||"NOMBRE DEL ASPIRANTE"),codigo=document.getElementById('codigo').value||"HEM-ACAD-2024-0520-001";ctx.fillStyle="#0f1110";ctx.fillRect(0,0,1600,1131);ctx.strokeStyle="#c9a227";ctx.lineWidth=8;ctx.strokeRect(20,20,1560,1091);ctx.lineWidth=2;ctx.strokeRect(40,40,1520,1051);ctx.fillStyle="#c9a227";ctx.font="bold 70px Arial";ctx.textAlign="center";ctx.fillText("CERTIFICADO",800,180);ctx.font="bold 28px Arial";ctx.fillRect(550,210,500,50);ctx.fillStyle="#000";ctx.fillText("DE APROBACION",800,243);ctx.fillStyle="#aaa";ctx.font="16px Arial";ctx.fillText("DE LA ACADEMIA MILITAR DEL ARMY OF HEMET LATAM",800,285);ctx.fillText("SE OTORGA EL PRESENTE CERTIFICADO A:",800,350);ctx.fillStyle="#fff";ctx.font="bold 55px Arial";ctx.fillText(nombre,800,470);ctx.fillStyle="#aaa";ctx.font="14px Arial";ctx.fillText("POR HABER COMPLETADO SATISFACTORIAMENTE EL PROCESO DE FORMACION,",800,560);ctx.fillText("DEMOSTRANDO DISCIPLINA, HONOR, LEALTAD Y COMPROMISO CON LA MISION.",800,580);ctx.fillText("***",800,610);ctx.fillText("ESTA APROBADO PARA INTEGRARSE AL ARMY OF HEMET LATAM",800,640);ctx.fillText("Y CUMPLIR CON LOS VALORES Y ESTANDARES QUE NOS DEFINEN COMO UNIDAD DE ELITE.",800,660);const url=`https://armyhemetlatam.github.io/certificados/verificar.html?c=${codigo}`;document.getElementById('qrcode').innerHTML="";new QRCode(document.getElementById('qrcode'),{text:url,width:160,height:160});setTimeout(()=>{const img=document.querySelector('#qrcode img');if(img){ctx.fillStyle="#fff";ctx.fillRect(1270,120,180,180);ctx.drawImage(img,1270,120,180,180);ctx.fillStyle="#aaa";ctx.font="10px Arial";ctx.textAlign="center";ctx.fillText(codigo,1360,320)}ctx.beginPath();ctx.arc(1360,500,100,0,Math.PI*2);ctx.fillStyle="#1a1a1a";ctx.fill();ctx.strokeStyle="#c9a227";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#c9a227";ctx.font="bold 14px Arial";ctx.fillText("HEMET LATAM",1360,470);ctx.font="bold 22px Arial";ctx.fillText("ARMY",1360,500);ctx.fillStyle="#fff";ctx.font="9px Arial";ctx.fillText("UNIDAD DE ACADEMIA",1360,530);ctx.fillText("BASE MILITAR DE HEMET",1360,545)},600)}function descargar(){const a=document.createElement('a');a.download=`Certificado_${document.getElementById('nombre').value||'HEMET'}.jpg`;a.href=canvas.toDataURL('image/jpeg',0.9);a.click()}generar();</script></body></html>
