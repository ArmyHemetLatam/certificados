<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERTIFICADOS ACADEMIA MILITAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{background:#050505;color:#d4af37;text-align:center;font-family:Arial;margin:0;padding:10px}
.panel{background:#141414;border:2px solid #d4af37;border-radius:14px;max-width:580px;margin:10px auto;padding:18px}
label{display:block;text-align:left;margin:8px 0 2px 4%;font-weight:bold;color:#e6c86a;font-size:13px}
input,select{width:92%;padding:11px;border-radius:8px;border:1px solid #d4af37;background:#222;color:#fff;margin:4px;font-size:15px}
.row{display:flex;gap:6px;width:92%;margin:0 auto}
.btn{background:linear-gradient(#e6c86a,#b8922d);color:#000;border:none;padding:14px;width:92%;border-radius:10px;font-weight:900;margin-top:12px;font-size:17px;cursor:pointer}
canvas{max-width:99%;border:3px solid #d4af37;border-radius:10px;margin:15px auto;display:block;background:#000}
</style>
</head>
<body>
<h2 style="font-family:Cinzel">CERTIFICADOS ACADEMIA MILITAR<br><span style="font-size:13px;color:#888">BASE MILITAR DE HEMET - 2026</span></h2>

<div class="panel">
<label>Nombre del Aspirante (solo aparece cuando escribes):</label>
<input id="nombre" placeholder="Ej: Gustavo Jimenez" oninput="generar()">

<label>Fecha:</label>
<div class="row">
<input id="dia" type="number" value="11" oninput="generar()">
<select id="mes" onchange="generar()">
<option>Enero</option><option>Febrero</option><option>Marzo</option><option>Abril</option><option>Mayo</option><option>Junio</option><option>Julio</option><option>Agosto</option><option>Septiembre</option><option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
</select>
<input id="anio" type="number" value="2026" oninput="generar()">
</div>

<label>Código (solo HEM-ACAD-):</label>
<input id="codigo" value="HEM-ACAD-2026-0002-246" oninput="generar()">

<button class="btn" onclick="generar()">⚡ GENERAR CERTIFICADO</button>
<button class="btn" style="background:#222;color:#d4af37;border:1px solid #d4af37" onclick="descargar()">⬇️ DESCARGAR HD</button>
</div>

<canvas id="c" width="2400" height="1700"></canvas>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const bg=new Image();
bg.src='plantilla.jpg';

function generar(){
let nom=document.getElementById('nombre').value.trim().toUpperCase();
let dia=document.getElementById('dia').value||'11';
let mes=document.getElementById('mes').value||'Enero';
let anio=document.getElementById('anio').value||'2026';
let cod=document.getElementById('codigo').value.trim().toUpperCase()||'HEM-ACAD-2026-0001';

if(cod && !cod.startsWith('HEM-ACAD-')){return;}

ctx.drawImage(bg,0,0,2400,1700);

// Tapar textos viejos de la plantilla
ctx.fillStyle='#0a0a0a';
ctx.fillRect(250,620,1900,300); // nombre
ctx.fillRect(180,1030,950,230); // fecha
ctx.fillRect(1330,1030,950,230); // certificado no

// NOMBRE - SOLO CUANDO ESCRIBES
ctx.textAlign='center';
if(nom !== ""){
ctx.fillStyle='#f7d97a';
ctx.font='bold 125px Cinzel, serif';
ctx.fillText(nom,1200,830);
}

// FECHA
ctx.textAlign='center';
ctx.fillStyle='#c9a227';
ctx.font='bold 20px Arial';
ctx.fillText('FECHA:',550,1085);
ctx.fillStyle='#e8d5a0';
ctx.font='bold 28px Arial';
ctx.fillText(dia+' de '+mes+' de '+anio,550,1140);

// CERTIFICADO No.
ctx.fillStyle='#c9a227';
ctx.font='bold 20px Arial';
ctx.fillText('CERTIFICADO No.',1850,1085);
ctx.fillStyle='#f3d87a';
ctx.font='bold 46px Arial';
ctx.fillText(cod.split('-').pop()||'0001',1850,1145);
ctx.font='14px Arial';
ctx.fillText(cod,1850,1180);

// FIRMAS
ctx.textAlign='center';
ctx.fillStyle='#d4af37';
ctx.font='italic 50px Brush Script MT, cursive';
ctx.fillText('Wilson',550,1330);
ctx.font='bold 18px Arial';
ctx.fillText('GENERAL FEDERAL WILSON',550,1370);
ctx.font='13px Arial';
ctx.fillStyle='#999';
ctx.fillText('COMANDANTE DE LA BASE - BASE MILITAR DE HEMET',550,1400);

ctx.fillStyle='#d4af37';
ctx.font='italic 48px Brush Script MT, cursive';
ctx.fillText('Xorrus Ramirez',1850,1330);
ctx.font='bold 18px Arial';
ctx.fillText('XORRUS RAMIREZ - MAYOR GENERAL',1850,1370);
ctx.font='13px Arial';
ctx.fillStyle='#999';
ctx.fillText('DIRECTOR ACADÉMICO - UNIDAD DE ACADEMIA',1850,1400);

// FOOTER ROLEPLAY
ctx.fillStyle='#121212';
ctx.fillRect(0,1600,2400,100);
ctx.fillStyle='#888';
ctx.font='15px Arial';
ctx.fillText('ESTE CERTIFICADO ES DE USO EXCLUSIVO PARA FICCIÓN Y JUEGOS DE ROL (ROLEPLAY)',1200,1645);
}

function descargar(){
let a=document.createElement('a');
let cod=document.getElementById('codigo').value||'HEM-ACAD';
let nom=document.getElementById('nombre').value||'certificado';
a.download=cod+'_'+nom+'.jpg';
a.href=canvas.toDataURL('image/jpeg',0.95);
a.click();
}

bg.onload=generar;
</script>
</body>
</html>
