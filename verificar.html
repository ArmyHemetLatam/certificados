<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación HEMET</title><style>body{background:#050a0e;color:#fff;font-family:monospace;display:grid;place-items:center;min-height:100vh;padding:20px}.box{max-width:520px;background:#0c151c;border:2px solid #333;padding:32px;text-align:center;width:100%}.ok{border-color:#7aff8a;box-shadow:0 0 30px rgba(122,255,138,.3)}.bad{border-color:#ff4d4d}.idbox{background:#000;border:1px solid #333;padding:10px;margin:15px 0;font-size:11px;color:#c9b07a;word-break:break-all}</style></head><body><div id="out" class="box">Verificando...</div><script>function genDB(){let db={};for(let i=1;i<=120;i++){let num=String(i).padStart(4,'0');let suf=100+((i*73)%900);let id=`HEM-ACAD-2026-${num}-${suf}`;let c1=((i*123)%10000).toString(36).toUpperCase().padStart(4,'0');let c2=((i*321)%10000).toString(36).toUpperCase().padStart(4,'0');let c3=((i*777)%10000).toString(36).toUpperCase().padStart(4,'0');db[id]={c:`${c1}-${c2}-${c3}`,f:"Agosto,2026"};}return db;}const DB=genDB();const id=new URLSearchParams(location.search).get('id');const out=document.getElementById('out');if(!id||!DB[id]){out.className='box bad';out.innerHTML=`<h1 style="color:#ff4d4d">✕ NO VALIDO</h1><div class="idbox">${id||'SIN ID'}</div><p>No existe.</p>`;}else{const info=DB[id];out.className='box ok';out.innerHTML=`<div style="color:#c9b07a">★ EJERCITO HEMET LATAM</div><h1 style="color:#7aff8a;font-size:48px">✓ VALIDO</h1><div class="idbox">${id}</div><p>CODIGO: ${info.c}<br>FECHA: ${info.f}<br>ESTADO: ACTIVO</p>`;}</script></body></html>
